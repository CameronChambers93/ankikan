<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Highlight Style Settings</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <span class="logo">あ</span>
    <h1>Highlight Style Settings</h1>
  </header>

  <section>
    <h2>Highlight Style</h2>
    <label for="style-preset">Preset</label>
    <select id="style-preset"></select>
    <details id="style-advanced">
      <summary>Advanced / Customize</summary>
      <!-- Controls generated from STYLE_SCHEMA by ensureStyleControls() in options.js. -->
      <div id="style-controls"></div>
    </details>
    <button id="resetStylesBtn">Reset to defaults</button>

    <div id="style-preview">
      <span class="anki-unknown">日本語</span>
      <span class="anki-unlearned">漢字</span>
      <span class="anki-learning">勉強</span>
      <span class="anki-learned">言葉</span>
    </div>
  </section>

  <section>
    <h2>Dictionary</h2>
    <button id="importDictBtn" type="button">Import dictionary…</button>
    <input id="dictFileInput" type="file" accept=".zip" style="display:none">
    <span id="dictStatus"></span>
  </section>

  <script type="module" src="dist/options.js"></script>
</body>
</html>
