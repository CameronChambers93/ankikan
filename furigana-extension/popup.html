<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <span class="logo">あ</span>
    <h1>Anki Furigana</h1>
  </header>

  <section>
    <label for="fieldName">Anki field name</label>
    <input id="fieldName" type="text" placeholder="Expression" spellcheck="false">
    <div class="row lemma-row">
      <label class="toggle-label">
        <input id="useLemma" type="checkbox">
        Use dictionary forms <span class="hint">(lemma server on port 7654)</span>
      </label>
    </div>
  </section>

  <section>
    <label for="allowedUrls">Allowed URLs <span class="hint">(one hostname per line; empty = all pages)</span></label>
    <textarea id="allowedUrls" rows="3" placeholder="nhk.or.jp&#10;example.com" spellcheck="false"></textarea>
  </section>

  <section>
    <label for="blockedUrls">Blocked URLs <span class="hint">(one hostname per line; always skipped)</span></label>
    <textarea id="blockedUrls" rows="3" placeholder="twitter.com&#10;reddit.com" spellcheck="false"></textarea>
  </section>

  <section>
    <div class="row">
      <label class="toggle-label">
        <input id="furiganaGlobal" type="checkbox">
        Show furigana
      </label>
    </div>
    <div id="furiganaPerStatus" class="per-status">
      <label>
        <input id="furiganaUnlearned" type="checkbox">
        <span class="dot unlearned"></span> Unlearned
      </label>
      <label>
        <input id="furiganaLearning" type="checkbox">
        <span class="dot learning"></span> Learning
      </label>
      <label>
        <input id="furiganaLearned" type="checkbox">
        <span class="dot learned"></span> Learned
      </label>
    </div>
  </section>

  <section>
    <h2>Highlight Style</h2>
    <div>
      <label>Default background colour <input type="color" id="global-bg-color"></label>
      <label>Default background opacity <input type="number" id="global-bg-opacity" step="0.01" min="0" max="1"></label>
      <label>Border radius <input type="number" id="global-border-radius" step="1" min="0"></label>
      <label>Default outline colour <input type="color" id="global-outline-color"></label>
      <label>Default outline opacity <input type="number" id="global-outline-opacity" step="0.01" min="0" max="1"></label>
      <label>Default outline width <input type="number" id="global-outline-width" step="1" min="0"></label>
    </div>
    <div>
      <label>Unlearned background colour <input type="color" id="unlearned-bg-color"></label>
      <label>Unlearned background opacity <input type="number" id="unlearned-bg-opacity" step="0.01" min="0" max="1"></label>
    </div>
    <div>
      <label>Learning background colour <input type="color" id="learning-bg-color"></label>
      <label>Learning background opacity <input type="number" id="learning-bg-opacity" step="0.01" min="0" max="1"></label>
    </div>
    <div>
      <label>Learned background colour <input type="color" id="learned-bg-color"></label>
      <label>Learned background opacity <input type="number" id="learned-bg-opacity" step="0.01" min="0" max="1"></label>
    </div>
    <button id="resetStylesBtn">Reset to defaults</button>
  </section>

  <div class="legend">
    <span class="swatch unlearned"></span>Unlearned
    <span class="swatch learning"></span>Learning
    <span class="swatch learned"></span>Learned
    <span class="dup-mark">✦</span>Duplicate
  </div>

  <div class="actions">
    <button id="scanBtn">Scan page</button>
  </div>

  <div id="status" class="status"></div>

  <script type="module" src="popup.js"></script>
</body>
</html>
